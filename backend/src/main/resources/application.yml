# Configuratia de baza a backend-ului. Valorile secrete NU stau aici: vin din mediu (backend/.env local,
# dashboard-ul gazdei in productie). Ce e aici sunt doar valori implicite sigure pentru dezvoltare.
spring:
  application:
    name: cpa-backend
  config:
    # Incarca backend/.env (gitignorat) cand exista, ca sa nu exporti manual variabilele la fiecare pornire.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    # H2 in memorie, in modul PostgreSQL, ca aceleasi migrari Flyway sa ruleze local si in productie.
    # In productie (profilul `prod`, vezi application-prod.yml) se cere SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    url: jdbc:h2:mem:cpa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  ai:
    openai:
      # Lipsa cheii nu trebuie sa opreasca aplicatia (cerinta Faza 2); disponibilitatea consilierului
      # se verifica separat, in pachetul `ai`. Valoarea reala vine DOAR din OPENAI_API_KEY.
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          # Un singur model, dintr-o singura proprietate (ADR 0007).
          model: ${cpa.llm.model}

cpa:
  llm:
    # Implicit gpt-5.6-terra (ADR 0010): inlocuieste gpt-5-mini, oprit la 2026-12-11.
    model: ${CPA_LLM_MODEL:gpt-5.6-terra}
    # Plafonul tokenilor generati intr-un raspuns (la modelele cu rationament include si tokenii de rationament).
    max-output-tokens: 4000
    # Cate mesaje recente intra in prompt; restul conversatiei ramane in baza de date, nu in factura.
    history-messages: 20
    # Cate mesaje vechi trebuie sa se strang in afara ferestrei pentru a rula o rezumare (pe loturi, ca sa coste rar).
    summary-batch-messages: 10
    # Plafonul apelurilor de unealta intr-un singur raspuns: opreste o bucla de unelte care ar consuma tokeni la nesfarsit.
    max-tool-calls: 8
    # USD per milion de tokeni, doar pentru jurnalul „cost per raspuns” (preturile gpt-5.6-terra, verificate 2026-11-11).
    input-usd-per-million: 2.0
    output-usd-per-million: 12.0
  stream:
    # Un comentariu SSE la fiecare 15 s, ca proxy-urile sa nu inchida un flux care tace in timp ce modelul gandeste.
    heartbeat-seconds: 15
  pricing:
    # Preturile energiei pentru calculatorul TCO (EUR): ORIENTATIVE si NEVERIFICATE, introduse la data de mai jos, de
    # revizuit inainte de productie (ca si catalogul). Cumparatorul le poate inlocui cu ale lui in conversatie.
    petrol-eur-per-liter: 1.55
    diesel-eur-per-liter: 1.60
    home-electricity-eur-per-kwh: 0.30
    public-electricity-eur-per-kwh: 0.55
    data-as-of: 2026-11-11
  cors:
    # Lista separata prin virgule; niciodata `*` (verificat la pornire).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  limits:
    # Protectia endpoint-ului public (limite per instanta, in memorie). Valorile sunt largi pentru un om care foloseste
    # aplicatia normal si stranse pentru un script: abuzul real este oprit de bugetul zilnic de tokeni.
    requests-per-minute-per-session: 60
    requests-per-minute-per-ip: 120
    sessions-per-hour-per-ip: 10
    max-conversations-per-session: 50
    max-messages-per-conversation: 200
    max-shortlist-items: 20
    # Bugete in tokeni (intrare + iesire) pe zi UTC; consumul real al fiecarui raspuns al modelului se inregistreaza dupa apel.
    daily-token-budget-per-session: 60000
    daily-token-budget-global: 1000000
    # Cate proxy-uri de incredere sunt intre internet si aplicatie: 0 = adresa conexiunii (local);
    # in `prod` se ia din X-Forwarded-For, de la dreapta (vezi application-prod.yml).
    trusted-proxy-hops: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    # Spring AI loga exceptia intreaga (cu mesajul furnizorului) cand un flux esueaza; mesajele OpenAI pot contine
    # fragmente de cheie. Eroarea ajunge oricum la noi, ca AdvisorUnavailableException, iar in jurnal intra doar tipul ei.
    org.springframework.ai.chat.model.MessageAggregator: "OFF"
  pattern:
    # Id-ul cererii apare in fiecare linie de log, ca sa poti lega un raspuns de eroare de jurnal.
    correlation: "[%X{requestId:-}] "
