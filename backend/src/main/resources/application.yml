# Configuratia de baza a backend-ului. Valorile secrete NU stau aici: vin din mediu (backend/.env local,
# dashboard-ul gazdei in productie). Ce e aici sunt doar valori implicite sigure pentru dezvoltare.
spring:
  application:
    name: cpa-backend
  config:
    # Incarca backend/.env (gitignorat) cand exista, ca sa nu exporti manual variabilele la fiecare pornire.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    # H2 in memorie, in modul PostgreSQL, ca aceleasi migrari Flyway sa ruleze local si in productie.
    # In productie (profilul `prod`, vezi application-prod.yml) se cere SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    url: jdbc:h2:mem:cpa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  ai:
    openai:
      # Lipsa cheii nu trebuie sa opreasca aplicatia (cerinta Faza 2); disponibilitatea consilierului
      # se verifica separat, in pachetul `ai`. Valoarea reala vine DOAR din OPENAI_API_KEY.
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          # Un singur model, dintr-o singura proprietate (ADR 0007).
          model: ${cpa.llm.model}

cpa:
  llm:
    model: ${CPA_LLM_MODEL:gpt-5-mini}
  cors:
    # Lista separata prin virgule; niciodata `*` (verificat la pornire).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  limits:
    # Protectia endpoint-ului public (limite per instanta, in memorie). Valorile sunt largi pentru un om care foloseste
    # aplicatia normal si stranse pentru un script: abuzul real este oprit de bugetul zilnic de tokeni.
    requests-per-minute-per-session: 60
    requests-per-minute-per-ip: 120
    sessions-per-hour-per-ip: 10
    max-conversations-per-session: 50
    max-messages-per-conversation: 200
    max-shortlist-items: 20
    # Bugete in tokeni (intrare + iesire) pe zi UTC; contabilizarea reala vine odata cu apelul catre model (Faza 5).
    daily-token-budget-per-session: 60000
    daily-token-budget-global: 1000000
    # Cate proxy-uri de incredere sunt intre internet si aplicatie: 0 = adresa conexiunii (local);
    # in `prod` se ia din X-Forwarded-For, de la dreapta (vezi application-prod.yml).
    trusted-proxy-hops: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    # Id-ul cererii apare in fiecare linie de log, ca sa poti lega un raspuns de eroare de jurnal.
    correlation: "[%X{requestId:-}] "
