# CI al backend-ului: ruleaza doar cand se schimba `backend/` (sau acest fisier), ca modificarile de frontend
# sa nu astepte un build Java si invers.
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Include testele unitare, @WebMvcTest, pornirea completa fara cheie OpenAI si testul ArchUnit de straturi.
      - run: ./mvnw -B -ntp verify

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      # Doar construieste imaginea (nu o publica): prinde un Dockerfile stricat inainte de deploy.
      - run: docker build --tag cpa-backend:ci backend
