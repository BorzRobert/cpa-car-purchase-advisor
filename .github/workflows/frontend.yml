# CI al frontend-ului: ruleaza doar cand se schimba `frontend/` (sau acest fisier), simetric cu backend.yml, ca un
# build Next.js sa nu astepte dupa modificari de Java si invers. Aceleasi comenzi ca "definition of done" din AGENTS.md.
name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Parserul SSE și transformările mesajelor sunt logică pură: rulează fără browser și fără backend.
      - run: npm test

      # Pe Linux fisierele au LF, deci verificarea Prettier (endOfLine: lf) trece fara `--end-of-line auto`.
      - run: npm run format:check

      # Fara nicio variabila de mediu: un build care depinde de chei locale ar pica abia pe Vercel.
      - run: npm run build
